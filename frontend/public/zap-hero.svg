<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title description">
  <title id="title">Zap — Be fast, sell more</title>
  <desc id="description">Zap's landing page design: a lightning logo, the words Be fast, Sell more, and an example business proposal.</desc>
  <defs>
    <linearGradient id="orb" x2="1" y2="1"><stop stop-color="#e9dfef"/><stop offset="1" stop-color="#f1e8d8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-25%" width="170%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#443153" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="700" rx="24" fill="#f8f7f4"/>
  <g transform="translate(78 56)">
    <rect width="44" height="46" rx="12" fill="#443153"/>
    <path d="m25 9-15 17h11l-3 12 16-19H23z" fill="#eddea7"/>
    <text x="56" y="35" font-family="Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="-2" fill="#302d35">zap<tspan fill="#9583a2">.</tspan></text>
  </g>
  <text x="1190" y="85" font-family="Arial, sans-serif" font-size="16" fill="#625077">Proposals, ready.</text>
  <circle cx="1064" cy="370" r="247" fill="url(#orb)" opacity=".72"/>
  <circle cx="1240" cy="558" r="79" fill="#ede1c3" opacity=".4"/>
  <g transform="translate(78 195)">
    <circle cx="5" cy="0" r="4" fill="#9583a2"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.8" fill="#827e86">KEEP THE OPPORTUNITY MOVING</text>
    <text y="120" font-family="Georgia, serif" font-size="102" letter-spacing="-4" fill="#302d35">Be fast,</text>
    <text y="232" font-family="Georgia, serif" font-size="102" letter-spacing="-4" fill="#625077">Sell more</text>
    <text y="291" font-family="Arial, sans-serif" font-size="20" fill="#827e86">Turn a good conversation into a proposal</text>
    <text y="321" font-family="Arial, sans-serif" font-size="20" fill="#827e86">while it’s still fresh.</text>
    <rect y="364" width="220" height="56" rx="10" fill="#443153"/>
    <text x="24" y="399" font-family="Arial, sans-serif" font-size="17" fill="#fff">Create a proposal</text>
    <path d="m184 384 8 8-8 8m-8-8h16" fill="none" stroke="#eddea7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(843 147) rotate(3 225 235)" filter="url(#shadow)">
    <rect width="433" height="461" rx="9" fill="#fff"/>
    <g transform="translate(36 37)">
      <text font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#443153">✳  Forma Studio</text>
      <text x="286" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.5" fill="#9583a2">EXAMPLE</text>
      <text y="51" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.6" fill="#827e86">PREPARED FOR NORTHSTAR COFFEE</text>
      <text y="99" font-family="Georgia, serif" font-size="33" fill="#302d35">A fresh chapter</text>
      <text y="139" font-family="Georgia, serif" font-size="33" fill="#302d35">for a growing brand.</text>
      <text y="172" font-family="Arial, sans-serif" font-size="12" fill="#827e86">Brand strategy &amp; website proposal</text>
      <path d="M0 198h360" stroke="#e8e5e0"/>
      <text y="229" font-family="Arial, sans-serif" font-size="10" fill="#9583a2">01</text>
      <text x="32" y="229" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#443153">A familiar feeling. A new location.</text>
      <g stroke="#eeeaf0" stroke-width="5" stroke-linecap="round"><path d="M33 251h312"/><path d="M33 265h312"/><path d="M33 279h228"/></g>
      <rect y="307" width="360" height="61" rx="6" fill="#f5f1f8"/>
      <text x="15" y="342" font-family="Arial, sans-serif" font-size="11" fill="#827e86">Project investment</text>
      <text x="247" y="344" font-family="Georgia, serif" font-size="26" fill="#443153">$4,800</text>
      <text y="399" font-family="Arial, sans-serif" font-size="9" fill="#9583a2">Thoughtfully prepared.</text>
      <text x="327" y="399" font-family="Arial, sans-serif" font-size="9" fill="#9583a2">01 / 02</text>
    </g>
  </g>
  <g transform="translate(770 562)" filter="url(#shadow)">
    <rect width="330" height="76" rx="13" fill="#fff"/>
    <circle cx="38" cy="38" r="19" fill="#edf2e9"/>
    <path d="m30 38 5 5 11-12" fill="none" stroke="#4d755d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="33" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#443153">The details, double-checked.</text>
    <text x="72" y="54" font-family="Arial, sans-serif" font-size="12" fill="#827e86">You make the final call.</text>
  </g>
</svg>
